user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    server {
        listen 80;
        server_name bz98gamewatcher.com www.bz98gamewatcher.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # $host, not the internal compose service name — redirecting to
            # "https://gamewatcher-frontend" sent browsers to a hostname that only resolves
            # inside the Docker network, so plain http:// requests never reached the site.
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name bz98gamewatcher.com www.bz98gamewatcher.com;

        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /etc/nginx/ssl/live/bz98gamewatcher.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/bz98gamewatcher.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Hashed build assets can be cached hard; index.html must not be, or clients pin to an old
        # bundle after a deploy.
        #
        # Cache-Control is set with `expires` rather than `add_header` on purpose: an add_header in
        # a nested block discards every add_header inherited from the server block, which would
        # silently drop the security headers above from exactly these responses.
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1y;
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;
        }

        location /api/ {
            proxy_pass http://gamewatcher-backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
