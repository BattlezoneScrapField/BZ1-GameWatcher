name: Build, test and publish

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/jj173/battlezone-api-ghcr
  WEB_IMAGE: ghcr.io/jj173/battlezone-web-ghcr

jobs:
  build_api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore API/BZAPI.csproj
      - name: Build
        run: dotnet build API/BZAPI.csproj --configuration Release --no-restore

  build_web:
    name: Build and test web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install dependencies
        working-directory: Web
        run: npm ci
      - name: Test
        working-directory: Web
        run: npm run test:ci
      - name: Build
        working-directory: Web
        run: npm run build

  publish:
    name: Publish images
    # Only publish from main, and only once the code is known to build and pass its tests.
    # Previously every push on every branch overwrote the production :latest tags.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ build_api, build_web ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./API
          push: true
          # Tagging by commit SHA as well as latest makes a rollback possible.
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./Web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
