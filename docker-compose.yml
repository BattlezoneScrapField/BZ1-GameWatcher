name: BZ1GameWatcher

services:
  gamewatcher-frontend:
    container_name: BZ1GameWatcherUI
    image: "ghcr.io/jj173/battlezone-web-ghcr:latest"
    build: ./Web
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    restart: always 
    deploy:
      resources:
        limits:
          memory: 1gb

  gamewatcher-backend:
    container_name: BZAPI
    image: "ghcr.io/jj173/battlezone-api-ghcr:latest"
    build: ./API
    networks:
      - app-network
    restart: always
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 2gb
        
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

networks:
  app-network:
    driver: bridge