name: BZ1GameWatcher

services:
  gamewatcher-frontend:
    container_name: BZ1GameWatcherUI
    image: "ghcr.io/${GHCR_OWNER:-battlezonescrapfield}/battlezone-web-ghcr:latest"
    build: ./Web
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    depends_on:
      - gamewatcher-backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 1gb

  gamewatcher-backend:
    container_name: BZAPI
    image: "ghcr.io/${GHCR_OWNER:-battlezonescrapfield}/battlezone-api-ghcr:latest"
    build: ./API
    networks:
      - app-network
    environment:
      # Supplied from the host environment or a .env file.
      - Steam__ApiKey=${STEAM_API_KEY:-}
    # Reachable only from nginx on app-network. Publishing 8080 exposed the API unencrypted on
    # the host, bypassing TLS entirely.
    expose:
      - "8080"
    restart: always
    deploy:
      resources:
        limits:
          memory: 2gb

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw
    # Without a command this container ran once and exited, so certificates were never renewed.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'
    restart: always

networks:
  app-network:
    driver: bridge
